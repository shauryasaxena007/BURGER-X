<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BURGER X | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .auth-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .brand {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .brand span {
            color: #f39c12;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
        }

        .auth-tabs button {
            width: 50%;
            border: none;
            padding: 10px;
            background: #eee;
            font-weight: bold;
        }

        .auth-tabs button.active {
            background: #f39c12;
            color: white;
        }

        .form-control {
            margin-bottom: 15px;
        }

        .auth-btn {
            width: 100%;
            border: none;
            padding: 12px;
            background: #f39c12;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }

        .auth-btn:hover {
            background: #d68910;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="brand">
        🍔 BURGER <span>X</span>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
        <button id="loginTab" class="active" onclick="showLogin()">
            Login
        </button>

        <button id="registerTab" onclick="showRegister()">
            Register
        </button>
    </div>


    <!-- LOGIN FORM -->

    <div id="loginForm">

        <input
            type="email"
            id="loginEmail"
            class="form-control"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            class="form-control"
            placeholder="Password"
        >

        <button class="auth-btn" onclick="loginUser()">
            Login
        </button>

    </div>


    <!-- REGISTER FORM -->

    <div id="registerForm" style="display:none;">

        <input
            type="text"
            id="registerName"
            class="form-control"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="registerEmail"
            class="form-control"
            placeholder="Email"
        >

        <input
            type="password"
            id="registerPassword"
            class="form-control"
            placeholder="Password"
        >

        <button class="auth-btn" onclick="registerUser()">
            Register
        </button>

    </div>


    <p id="message"></p>

    <a href="sindex.html" class="back-home">
        ← Back to BURGER X
    </a>

</div>


<script>

    // =========================
    // SHOW LOGIN
    // =========================

    function showLogin() {

        document.getElementById("loginForm").style.display = "block";
        document.getElementById("registerForm").style.display = "none";

        document.getElementById("loginTab").classList.add("active");
        document.getElementById("registerTab").classList.remove("active");

        document.getElementById("message").textContent = "";
    }


    // =========================
    // SHOW REGISTER
    // =========================

    function showRegister() {

        document.getElementById("loginForm").style.display = "none";
        document.getElementById("registerForm").style.display = "block";

        document.getElementById("loginTab").classList.remove("active");
        document.getElementById("registerTab").classList.add("active");

        document.getElementById("message").textContent = "";
    }


    // =========================
    // LOGIN
    // =========================

    async function loginUser() {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        if (!email || !password) {

            document.getElementById("message").textContent =
                "Please enter email and password.";

            return;
        }

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const data = await response.json();

            console.log(data);

            if (data.success) {

                // Save logged-in user
                localStorage.setItem(
                    "burgerx_user",
                    JSON.stringify(data.user)
                );

                document.getElementById("message").textContent =
                    "Login successful!";

                // Go to main website
                setTimeout(() => {
                    window.location.href = " /";
                }, 1000);

            } else {

                document.getElementById("message").textContent =
                    data.message;
            }

        } catch (error) {

            console.error(error);

            document.getElementById("message").textContent =
                "Unable to connect to server.";
        }
    }


    // =========================
    // REGISTER
    // =========================

    async function registerUser() {

        const name =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const password =
            document.getElementById("registerPassword").value;

        if (!name || !email || !password) {

            document.getElementById("message").textContent =
                "Please fill all fields.";

            return;
        }

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                }
            );

            const data = await response.json();

            console.log(data);

            document.getElementById("message").textContent =
                data.message;

            if (data.success) {

                // Switch to login after registration
                setTimeout(() => {
                    showLogin();
                }, 1000);

            }

        } catch (error) {

            console.error(error);

            document.getElementById("message").textContent =
                "Unable to connect to server.";
        }
    }

</script>

</body>
</html>
